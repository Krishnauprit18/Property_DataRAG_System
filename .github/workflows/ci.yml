name: "CI & DevSecOps Supply Chain"

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  devsecops:
    name: "Scan, Test & Package"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Tests
        run: |
          pip install flake8 pytest
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          pytest tests/ -v

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint and Package Helm Chart
        run: |
          helm lint deploy/helm/property-rag/
          mkdir -p deploy/helm/packages
          helm package deploy/helm/property-rag/ -d deploy/helm/packages/
