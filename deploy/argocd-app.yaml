apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: property-rag-system
  namespace: argocd
  finalizers:                                                                                                           
        - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/Krishnauprit18/Property_DataRAG_System.git'
    targetRevision: master
    path: deploy/overlays/local
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: property-rag
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true