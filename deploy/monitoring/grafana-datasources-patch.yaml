apiVersion: v1
kind: ConfigMap 
metadata: 
  name: grafana-datasources 
  namespace: monitoring 
data: 
  datasources.yaml: |
    apiVersion: 1
    datasources: 
      - name: Prometheus 
        type: prometheus 
        access: proxy 
        url: http://prometheus-svc.monitoring.svc.cluster.local:9090
        isDefault: true
        jsonData: 
          timeInterval: 5s
      - name: Loki 
        type: loki 
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        jsonData: 
          maxLines: 100 
      - name: Jaeger 
        type: jaeger 
        access: proxy 
        url: http://jaeger-service.monitoring.svc.cluster.local:16686
        jsonData: 
          tracesToLogs:
            datasourceUid: Loki