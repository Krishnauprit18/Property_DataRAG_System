apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-user
  annotations:
    policies.kyverno.io/title: Disallow Root User
    policies.kyverno.io/category: Pod Security Standards
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: false
  rules:
  - name: check-run-as-non-root
    match:
      any:
        - resources:
            kinds:
              - Pod
    exclude:
      any:
        - resources:
            namespaces:
              - kube-system
              - kyverno
              - cert-manager
              - argocd
              - argo-rollouts
              - monitoring
              - ingress-nginx
    validate:
      message: "Security Violation [disallow-root-user]: Containers must not run as root! You must specify securityContext.runAsNonRoot=true."
      pattern:
        spec:
          =(securityContext):
            runAsNonRoot: true
          containers:
            - =(runAsNonRoot): true
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  background: false
  rules:
  - name: check-resources
    match:
      any:
        - resources:
            kinds:
              - Pod
    exclude:
      any:
        - resources:
            namespaces:
              - kube-system
              - kyverno
              - cert-manager
              - argocd
              - argo-rollouts
              - monitoring
              - ingress-nginx
    validate:
      message: "Security Violation [require-resource-limits]: CPU and Memory requests and limits are mandatory!"
      pattern:
        spec:
          containers:
          - resources:
              requests:
                cpu: "?*"
                memory: "?*"
              limits:
                cpu: "?*"
                memory: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - cert-manager
                - argocd
                - argo-rollouts
                - monitoring
                - ingress-nginx
      validate:
        message: "Security Violation [disallow-latest-tag]: Image tag ':latest' is strictly forbidden in production!"
        pattern:
          spec:
            containers:
            - image: "!*:latest"
