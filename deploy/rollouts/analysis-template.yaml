apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: backend-health-check
  namespace: property-rag
spec:
  metrics:
    - name: backend-prometheus-health
      interval: 10s
      count: 3
      successCondition: result[0] == 1
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-svc.monitoring.svc.cluster.local:9090
          query: up{job="property-rag-backend"}
