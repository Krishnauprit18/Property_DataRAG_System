apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: {{ .Values.global.namespace }}
  labels:
    app: backend
    {{- include "property-rag.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.backend.service.port }}"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
          env:
            - name: PORT
              value: "{{ .Values.backend.env.port }}"
            - name: CHROMA_PERSIST_DIRECTORY
              value: "{{ .Values.backend.env.chromaPersistDir }}"
            - name: ANALYTICS_DIRECTORY
              value: "{{ .Values.backend.env.analyticsDir }}"
            - name: ENVIRONMENT
              value: "{{ .Values.backend.env.environment }}"
            - name: DEBUG
              value: "{{ .Values.backend.env.debug }}"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secretName }}
                  key: GEMINI_API_KEY
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: chroma-storage
              mountPath: {{ .Values.backend.env.chromaPersistDir }}
            - name: analytics-storage
              mountPath: {{ .Values.backend.env.analyticsDir }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: chroma-storage
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.chroma.name }}
        - name: analytics-storage
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.analytics.name }}
