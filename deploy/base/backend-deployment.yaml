apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: property-rag
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: property-rag-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: BACKEND_HOST
              value: "0.0.0.0"
            - name: BACKEND_PORT
              value: "8000"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: property-rag-secrets
                  key: GEMINI_API_KEY
                  optional: true
          volumeMounts:
            - name: chroma-storage
              mountPath: /app/backend/chroma_db
            - name: analytics-storage
              mountPath: /app/backend/analytics
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 25
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: chroma-storage
          persistentVolumeClaim:
            claimName: chroma-pvc
        - name: analytics-storage
          persistentVolumeClaim:
            claimName: analytics-pvc