apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: property-rag-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: "Property RAG Enterprise Root CA"
  secretName: property-rag-root-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: property-rag-ca-issuer
spec:
  ca:
    secretName: property-rag-root-ca-secret